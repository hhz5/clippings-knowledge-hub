<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪藏知识库 · 按作者与标签查阅</title>
<meta name="description" content="AI 主题剪藏知识库，按作者与标签两个维度浏览与全文检索。">
<link rel="stylesheet" href="assets/style.css">
<script>
  // 主题初始化：在渲染前应用，避免闪烁
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html">剪藏<span>知识库</span></a>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M11 19a8 8 0 110-16 8 8 0 010 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="全文检索标题 / 作者 / 标签 / 正文…" autocomplete="off">
    </div>
    <div class="top-actions">
      <a class="filter-btn" id="adminLink" href="admin/" title="内容管理后台">管理</a>
      <button class="filter-btn" id="filterBtn" aria-label="打开筛选">筛选</button>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题">🌓</button>
    </div>
  </div>
</header>

<section class="hero" id="hero" style="display:none">
  <div class="wrap">
    <div class="hero-head">
      <h1>最新剪藏</h1>
      <p class="hero-sub">精选最近更新的内容</p>
    </div>
    <div class="hero-grid" id="heroGrid"></div>
  </div>
</section>

<div class="wrap layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="side-title">浏览维度</div>
      <button class="side-close" id="sideClose" aria-label="关闭">✕</button>
    </div>
    <div class="side-section">
      <div class="side-title">作者 <span class="cnt" id="authorCount"></span></div>
      <div class="author-list" id="authorList"></div>
    </div>
    <div class="side-section">
      <div class="side-title">标签 <span class="cnt" id="tagCount"></span></div>
      <div class="chips" id="tagList"></div>
    </div>
  </aside>

  <main class="main-content">
    <div class="results-head">
      <h2 id="resultTitle">全部剪藏</h2>
      <div class="sub" id="resultSub"></div>
    </div>
    <div class="filter-bar" id="filterBar" style="display:none"></div>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="empty-icon">🔍</div>
      <p>没有匹配的文章，试试调整筛选或搜索词。</p>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
